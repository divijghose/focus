name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e . --no-deps

      - name: Run syntax checks
        run: |
          python -m compileall focus

      - name: Run tests
        run: |
          if python - <<'PY'
import importlib.util
import sys
print(importlib.util.find_spec('firedrake') is not None)
PY
          then
            python -m pytest -q
          else
            echo 'Firedrake is not available in this environment; skipping pytest.'
          fi
